name: Build WeixinMiniGame
# 更多有关构建工作流的信息，请参考 https://devops.u3dcloud.cn/help/docs/advanced/yaml
# 您也可以访问注释中的其它链接来了解更多关于 云构建 action 的使用方法

# 在提交至代码库时触发云构建任务
on: [push]

jobs:
  build:
    name: Build WeixinMiniGame
    # 为了让工作流可以正常触发，需要指定正确的 runs-on 标签
    # https://devops.u3dcloud.cn/help/docs/advanced/yaml#%E8%A7%A6%E5%8F%91%E5%B7%A5%E4%BD%9C%E6%B5%81
    runs-on: windows-server-2022-tuanjie-1.2.0-weixinminigame-8c-16g
    steps:
      # 从公网 Gitee 克隆项目(内部 Gitea 和 Plastic SCM 都没有项目文件)
      # 注意：weixin 构建需要 ProjectSettings 里配置微信小游戏 target，否则可能失败
      - name: Check out project repository
        shell: bash
        run: |
          echo "=== Cloning from public Gitee (depth 1) ==="
          git clone --depth 1 https://gitee.com/ZX666X/unity-game-1.git tjcloudbuild 2>&1 || echo "!!! git clone FAILED (exit $?)"

      # 诊断：确认克隆内容
      - name: List workspace content
        shell: bash
        run: |
          echo "===== WORKSPACE DIAGNOSTIC ====="
          echo "--- pwd ---"
          pwd
          echo "--- ls -la ./tjcloudbuild ---"
          ls -la ./tjcloudbuild
          echo "--- find ProjectVersion.txt under ./tjcloudbuild ---"
          find ./tjcloudbuild -name "ProjectVersion.txt" 2>/dev/null || true
          echo "--- top-level dirs in tjcloudbuild (depth 2) ---"
          find ./tjcloudbuild -maxdepth 2 -type d 2>/dev/null | head -40 || true
          echo "===== END DIAGNOSTIC ====="

      # 构建 https://devops.u3dcloud.cn/help/docs/advanced/action#actionstj-builder
      - name: Build project
        uses: actions/tj-builder@v3
        id: build-action
        with:
          targetPlatform: WeixinMiniGame
          projectPath: ./tjcloudbuild
          versioning: Custom
          version: 0.1.0

      # 检查构建结果是否成功生成
      - name: Check build result
        shell: bash
        run: ls -l ${{ steps.build-action.outputs.buildsPath }}

      # 上传制品 https://devops.u3dcloud.cn/help/docs/advanced/action#actionstj-upload-artifact
      - name: Upload artifact
        uses: actions/tj-upload-artifact@v2
        with:
          name: Build-${{ steps.build-action.outputs.buildVersion }}
          path: ${{ steps.build-action.outputs.buildsPath }}
